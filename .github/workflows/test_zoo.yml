name: Zoo Managment Tests

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get code in
        uses: actions/checkout@v7
      - name: Get action setup
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
      - name: Install Pytest
        run: pip install pytest --no-cache-dir
      - name: Run pytest
        run: pytest